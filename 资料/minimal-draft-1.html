<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Draft 1</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-paper: #fbfbfa;
    --color-ink: #1a1a1a;
    --color-mute: #8e8e8b;
    --color-line: #ebebe8;
    --font-sans: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
</style>
</head>
<body class="bg-paper text-ink font-sans antialiased">

<header class="sticky top-0 z-10 bg-paper/90 backdrop-blur">
  <div class="mx-auto max-w-6xl px-10 h-16 flex items-center justify-between text-sm">
    <a href="#/" class="tracking-wide">（我的名字）</a>
    <nav class="flex gap-8">
      <a href="#/" data-nav="home">首页</a>
      <a href="#/collection" data-nav="collection">收集</a>
    </nav>
  </div>
</header>

<main class="mx-auto max-w-6xl px-10">
  <section id="home">
    <div class="pt-32 pb-28 max-w-xl">
      <h1 class="text-3xl font-light tracking-tight">（我的名字）</h1>
      <p class="mt-5 text-mute leading-relaxed">在这里存放我拍下的、截下的和随手记下的东西。</p>
    </div>
    <div class="flex items-baseline justify-between border-t border-line pt-6 mb-10 text-sm">
      <h2 class="text-mute">最近</h2>
      <a href="#/collection" class="hover:text-mute transition">查看全部 →</a>
    </div>
    <div id="recent" class="columns-3 gap-10"></div>
  </section>

  <section id="collection" hidden>
    <div class="pt-24 pb-14 flex items-end justify-between">
      <div>
        <h1 class="text-3xl font-light tracking-tight">收集</h1>
        <p id="count" class="mt-4 text-sm text-mute"></p>
      </div>
      <div id="filters" class="flex gap-7 text-sm"></div>
    </div>
    <div id="groups"></div>
  </section>
</main>

<footer class="mx-auto max-w-6xl px-10 pt-24 pb-12 text-xs text-mute">© 2026 （我的名字）</footer>

<div id="modal" class="fixed inset-0 z-20 bg-paper/97 hidden" role="dialog" aria-modal="true">
  <button id="close" class="absolute top-6 right-10 text-sm text-mute hover:text-ink transition">关闭</button>
  <button id="prev" class="absolute left-6 top-1/2 -translate-y-1/2 p-4 text-xl text-mute hover:text-ink transition" aria-label="上一条">←</button>
  <button id="next" class="absolute right-6 top-1/2 -translate-y-1/2 p-4 text-xl text-mute hover:text-ink transition" aria-label="下一条">→</button>
  <div id="stage" class="h-full flex flex-col items-center justify-center px-28 py-16"></div>
</div>

<p class="fixed bottom-4 left-4 text-[11px] text-mute">Draft 1 · 极简方向 · 示例内容</p>

<script>
// 示例数据，从新到旧。photo 的 w/h 是比例
const items = [
  { type: 'photo', date: '2026-09-26', text: '傍晚回家路上的天。', seed: 'dusk', w: 4, h: 5 },
  { type: 'note',  date: '2026-09-24', text: '今天什么都没做，但心情不错。' },
  { type: 'shot',  date: '2026-09-21', text: '朋友发来的一句话。', quote: '慢慢来，比较快。' },
  { type: 'photo', date: '2026-09-18', text: '楼下新开的咖啡店。', seed: 'cafe', w: 3, h: 2 },
  { type: 'photo', date: '2026-09-12', text: '桌上的光。', seed: 'desk', w: 1, h: 1 },
  { type: 'note',  date: '2026-09-08', text: '秋天第一次穿外套。' },
  { type: 'shot',  date: '2026-09-02', text: '书里看到的一段话。', quote: '（书摘占位：一段喜欢的文字）' },
  { type: 'photo', date: '2026-08-28', text: '海边。', seed: 'sea', w: 4, h: 5 },
  { type: 'note',  date: '2026-08-20', text: '下雨天适合什么都不想。' },
  { type: 'photo', date: '2026-08-15', text: '路过的街角。', seed: 'street', w: 3, h: 2 },
  { type: 'shot',  date: '2026-08-09', text: '备忘录里的一条。', quote: '（截图占位：备忘录内容）' },
  { type: 'photo', date: '2026-08-03', text: '窗外的树。', seed: 'tree', w: 2, h: 3 },
  { type: 'note',  date: '2026-07-30', text: '夏天快过完了。' },
  { type: 'photo', date: '2026-07-22', text: '一顿好吃的晚饭。', seed: 'dinner', w: 3, h: 2 },
  { type: 'shot',  date: '2026-07-15', text: '聊天记录里的一句。', quote: '（截图占位：一段对话）' },
  { type: 'photo', date: '2026-07-06', text: '七月的云。', seed: 'cloud', w: 4, h: 5 },
];
const labels = { photo: '照片', shot: '截图', note: '短句' };
const $ = id => document.getElementById(id);
let filter = 'all', ctx = [], cur = -1;

function body(it, big) {
  if (it.type === 'photo') {
    const src = `https://picsum.photos/seed/${it.seed}/${it.w * 300}/${it.h * 300}`;
    return big
      ? `<img src="${src}" alt="${it.text}" class="max-h-[72vh] max-w-full object-contain bg-line">`
      : `<img src="${src}" alt="${it.text}" loading="lazy" class="w-full bg-line group-hover:opacity-85 transition" style="aspect-ratio:${it.w}/${it.h}">`;
  }
  if (it.type === 'shot') {
    const shot = `<div class="w-full ${big ? 'aspect-[9/19]' : 'aspect-[9/16]'} bg-white border border-line p-5 flex flex-col gap-3">
        <div class="h-1.5 w-12 bg-line"></div><div class="h-1.5 w-24 bg-line"></div>
        <p class="my-auto text-sm leading-relaxed">${it.quote}</p>
        <div class="h-1.5 w-20 bg-line"></div><div class="h-1.5 w-10 bg-line"></div></div>`;
    return big ? `<div class="w-[360px] max-h-[72vh] overflow-y-auto">${shot}</div>` : `<div class="group-hover:opacity-85 transition">${shot}</div>`;
  }
  return big
    ? `<p class="max-w-xl text-3xl font-light leading-relaxed text-center">${it.text}</p>`
    : `<p class="text-lg font-light leading-relaxed py-8 border-y border-line group-hover:text-mute transition">${it.text}</p>`;
}

function card(it, i, list) {
  const b = document.createElement('button');
  b.className = 'group block w-full text-left mb-10 break-inside-avoid cursor-pointer';
  b.innerHTML = body(it, false) + `<p class="mt-3 text-xs text-mute">${it.date.replaceAll('-', '.')}</p>`;
  b.onclick = () => open(list, i);
  return b;
}

function open(list, i) {
  ctx = list; cur = i;
  const it = list[i];
  $('stage').innerHTML = body(it, true) + (it.type === 'note'
    ? `<p class="mt-8 text-xs text-mute">${it.date.replaceAll('-', '.')}</p>`
    : `<p class="mt-6 text-sm">${it.text}</p><p class="mt-2 text-xs text-mute">${labels[it.type]} · ${it.date.replaceAll('-', '.')}</p>`);
  $('prev').classList.toggle('invisible', i === 0);
  $('next').classList.toggle('invisible', i === list.length - 1);
  $('modal').classList.remove('hidden');
  document.body.classList.add('overflow-hidden');
}
function close() {
  $('modal').classList.add('hidden');
  document.body.classList.remove('overflow-hidden');
}
$('close').onclick = close;
$('prev').onclick = () => cur > 0 && open(ctx, cur - 1);
$('next').onclick = () => cur < ctx.length - 1 && open(ctx, cur + 1);
$('modal').onclick = e => (e.target.id === 'modal' || e.target.id === 'stage') && close();
addEventListener('keydown', e => {
  if ($('modal').classList.contains('hidden')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});

function renderCollection() {
  const list = filter === 'all' ? items : items.filter(x => x.type === filter);
  $('count').textContent = `共 ${list.length} 条`;
  $('filters').innerHTML = '';
  for (const [k, v] of [['all', '全部'], ['photo', '照片'], ['shot', '截图'], ['note', '短句']]) {
    const f = document.createElement('button');
    f.textContent = v;
    f.className = 'cursor-pointer transition ' + (k === filter ? 'text-ink underline underline-offset-8' : 'text-mute hover:text-ink');
    f.onclick = () => { filter = k; renderCollection(); };
    $('filters').append(f);
  }
  const groups = $('groups');
  groups.innerHTML = '';
  if (!list.length) { groups.innerHTML = '<p class="py-32 text-center text-sm text-mute">这里还没有东西</p>'; return; }
  const byMonth = {};
  list.forEach((it, i) => (byMonth[it.date.slice(0, 7)] ??= []).push([it, i]));
  for (const [m, arr] of Object.entries(byMonth)) {
    const sec = document.createElement('section');
    sec.className = 'grid grid-cols-[120px_1fr] gap-10 border-t border-line pt-8 pb-12';
    sec.innerHTML = `<h3 class="text-sm text-mute sticky top-24 self-start">${m.replace('-', '.')}</h3><div class="columns-3 gap-10"></div>`;
    arr.forEach(([it, i]) => sec.lastChild.append(card(it, i, list)));
    groups.append(sec);
  }
}

function route() {
  const c = location.hash === '#/collection';
  $('home').hidden = c;
  $('collection').hidden = !c;
  document.querySelectorAll('[data-nav]').forEach(a => {
    a.className = 'transition ' + ((a.dataset.nav === 'collection') === c ? 'text-ink underline underline-offset-8' : 'text-mute hover:text-ink');
  });
  scrollTo(0, 0);
}

const recent = items.slice(0, 8);
recent.forEach((it, i) => $('recent').append(card(it, i, recent)));
renderCollection();
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
